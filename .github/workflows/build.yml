name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
      run_tests:
        description: 'Run tests'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_CMDLINE_TOOLS: '11076708'
  ANDROID_PLATFORM: 'android-34'
  GRADLE_VERSION: '8.4'
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sdk-cache-key: ${{ steps.sdk-key.outputs.key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Compute SDK cache key
        id: sdk-key
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::FAILED -> \"$BASH_COMMAND\" (line $LINENO)"' ERR
          KEY="android-sdk-v1-${{ runner.os }}-${{ env.ANDROID_CMDLINE_TOOLS }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_PLATFORM }}"
          echo "SDK cache key: $KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Cache Android SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ steps.sdk-key.outputs.key }}
          restore-keys: |
            android-sdk-v1-${{ runner.os }}-

      - name: Install Android SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::FAILED -> \"$BASH_COMMAND\" (line $LINENO)"' ERR

          SDK_ROOT="${{ env.ANDROID_SDK_ROOT }}"
          CMDLINE_ZIP="commandlinetools-linux-${{ env.ANDROID_CMDLINE_TOOLS }}_latest.zip"
          URL="https://dl.google.com/android/repository/${CMDLINE_ZIP}"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          curl --fail --location --show-error --retry 3 --retry-delay 5 \
            --connect-timeout 30 --output "$CMDLINE_ZIP" "$URL"
          [ -s "$CMDLINE_ZIP" ] || { echo "::error::Downloaded archive is empty"; exit 1; }

          rm -rf "$SDK_ROOT/cmdline-tools/latest" "$SDK_ROOT/cmdline-tools/cmdline-tools"
          unzip -q "$CMDLINE_ZIP" -d "$SDK_ROOT/cmdline-tools"
          rm -f "$CMDLINE_ZIP"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version

          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail

          "$SDKMANAGER" "platforms;${{ env.ANDROID_PLATFORM }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" "platform-tools"

      - name: Export SDK environment
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::FAILED -> \"$BASH_COMMAND\" (line $LINENO)"' ERR
          SDK_ROOT="${{ env.ANDROID_SDK_ROOT }}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::FAILED -> \"$BASH_COMMAND\" (line $LINENO)"' ERR
          sdkmanager --version
          adb version

  build:
    name: Build Application
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Restore Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ needs.setup.outputs.sdk-cache-key }}
          fail-on-cache-miss: true

      - name: Export SDK environment
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::FAILED -> \"$BASH_COMMAND\" (line $LINENO)"' ERR
          SDK_ROOT="${{ env.ANDROID_SDK_ROOT }}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Prepare error report directory
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/error-report"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::FAILED -> \"$BASH_COMMAND\" (line $LINENO)"' ERR
          [ -f "./gradlew" ] || { echo "::error::gradlew missing"; exit 1; }
          [ -f "gradle/wrapper/gradle-wrapper.jar" ] || { echo "::error::gradle-wrapper.jar missing"; exit 1; }
          [ -f "gradle/wrapper/gradle-wrapper.properties" ] || { echo "::error::gradle-wrapper.properties missing"; exit 1; }
          chmod +x ./gradlew
          ./gradlew --version

      - name: Clean build
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/gradle-clean.log
          REPORT_DIR="${{ github.workspace }}/error-report"
          mkdir -p "$REPORT_DIR"

          set +e
          ./gradlew clean --no-daemon --stacktrace --console=plain > "$LOG" 2>&1
          EXIT=$?
          set -e

          if [ $EXIT -ne 0 ]; then
            {
              echo "=== STEP: Clean build ==="
              echo "Command: ./gradlew clean"
              echo "Exit Code: $EXIT"
              echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
              echo "--- Filtered Errors ---"
              grep -nE 'error:|^e: |FAILURE:|FAILED|Caused by:|Exception|Execution failed|BUILD FAILED|What went wrong|> Task .* FAILED' "$LOG" | head -200 || true
              echo ""
              echo "--- Failure Context ---"
              awk '/What went wrong|FAILURE: Build failed|Execution failed for task/{f=1;c=0} f&&c<80{print;c++} /BUILD FAILED/{if(f)exit}' "$LOG" || true
            } > "$REPORT_DIR/01-clean-build-errors.txt"
            echo "::error::Gradle clean failed (exit $EXIT)"
            exit $EXIT
          fi
          echo "Clean build OK"

      - name: Determine build type
        id: bt
        shell: bash
        run: |
          set -euo pipefail
          BT="${{ github.event.inputs.build_type }}"
          [ -z "$BT" ] && BT="debug"
          case "$BT" in debug|release) ;; *) echo "::error::Invalid build type: $BT"; exit 1 ;; esac
          echo "type=$BT" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        if: steps.bt.outputs.type == 'debug'
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/gradle-build.log
          REPORT_DIR="${{ github.workspace }}/error-report"
          mkdir -p "$REPORT_DIR"

          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain > "$LOG" 2>&1
          EXIT=$?
          set -e

          if [ $EXIT -ne 0 ]; then
            {
              echo "=== STEP: Build debug APK ==="
              echo "Command: ./gradlew assembleDebug"
              echo "Exit Code: $EXIT"
              echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
              echo "--- Filtered Errors ---"
              grep -nE 'error:|^e: |FAILURE:|FAILED|Caused by:|Exception|Execution failed|BUILD FAILED|What went wrong|> Task .* FAILED|Unresolved reference|Compilation error' "$LOG" | head -300 || true
              echo ""
              echo "--- Failure Context ---"
              awk '/What went wrong|FAILURE: Build failed|Execution failed for task/{f=1;c=0} f&&c<120{print;c++} /BUILD FAILED/{if(f)exit}' "$LOG" || true
            } > "$REPORT_DIR/02-build-debug-errors.txt"
            echo "::error::assembleDebug failed (exit $EXIT)"
            exit $EXIT
          fi

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1 || true)"
          [ -n "$APK" ] && [ -f "$APK" ] || { echo "::error::Debug APK not produced"; exit 1; }
          echo "DEBUG_APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.bt.outputs.type == 'release'
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/gradle-build.log
          REPORT_DIR="${{ github.workspace }}/error-report"
          mkdir -p "$REPORT_DIR"

          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain > "$LOG" 2>&1
          EXIT=$?
          set -e

          if [ $EXIT -ne 0 ]; then
            {
              echo "=== STEP: Build release APK ==="
              echo "Command: ./gradlew assembleRelease"
              echo "Exit Code: $EXIT"
              echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
              echo "--- Filtered Errors ---"
              grep -nE 'error:|^e: |FAILURE:|FAILED|Caused by:|Exception|Execution failed|BUILD FAILED|What went wrong|> Task .* FAILED|Unresolved reference|Compilation error' "$LOG" | head -300 || true
              echo ""
              echo "--- Failure Context ---"
              awk '/What went wrong|FAILURE: Build failed|Execution failed for task/{f=1;c=0} f&&c<120{print;c++} /BUILD FAILED/{if(f)exit}' "$LOG" || true
            } > "$REPORT_DIR/02-build-release-errors.txt"
            echo "::error::assembleRelease failed (exit $EXIT)"
            exit $EXIT
          fi

          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1 || true)"
          [ -n "$APK" ] && [ -f "$APK" ] || { echo "::error::Release APK not produced"; exit 1; }
          echo "RELEASE_APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Build APK artifact (upload)
        if: success() && steps.bt.outputs.type == 'debug' && env.DEBUG_APK_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: sqli-hunter-debug-apk
          path: ${{ env.DEBUG_APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Release APK artifact (upload)
        if: success() && steps.bt.outputs.type == 'release' && env.RELEASE_APK_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: sqli-hunter-release-apk
          path: ${{ env.RELEASE_APK_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Package & upload error report (ZIP)
        if: failure()
        shell: bash
        run: |
          REPORT_DIR="${{ github.workspace }}/error-report"
          mkdir -p "$REPORT_DIR"
          if [ -z "$(ls -A "$REPORT_DIR" 2>/dev/null)" ]; then
            echo "Build failed but no filtered error file was produced." > "$REPORT_DIR/00-readme.txt"
            echo "Check the job log for the step that failed." >> "$REPORT_DIR/00-readme.txt"
          fi
          cd "$REPORT_DIR"
          zip -r "${{ github.workspace }}/build-error-report.zip" . >/dev/null
          echo "Created build-error-report.zip"

      - name: Upload error report ZIP
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-report
          path: ${{ github.workspace }}/build-error-report.zip
          if-no-files-found: warn
          retention-days: 30

  test:
    name: Run Tests
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.run_tests != 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Restore Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ needs.setup.outputs.sdk-cache-key }}
          fail-on-cache-miss: true

      - name: Export SDK environment
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${{ env.ANDROID_SDK_ROOT }}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Grant execute permission
        shell: bash
        run: chmod +x ./gradlew

      - name: Run unit tests
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/gradle-test.log
          REPORT_DIR="${{ github.workspace }}/error-report"
          mkdir -p "$REPORT_DIR"

          set +e
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --continue --console=plain > "$LOG" 2>&1
          EXIT=$?
          set -e

          if [ $EXIT -ne 0 ]; then
            {
              echo "=== STEP: Run unit tests ==="
              echo "Command: ./gradlew testDebugUnitTest"
              echo "Exit Code: $EXIT"
              echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
              echo "--- Failed Tests ---"
              grep -nE 'FAILED|Test .* FAILED|tests completed|tests failed|AssertionError|expected:|but was:|Execution failed' "$LOG" | head -200 || true
              echo ""
              echo "--- Filtered Errors ---"
              grep -nE 'error:|^e: |FAILURE:|Caused by:|Exception|BUILD FAILED|What went wrong|> Task .* FAILED' "$LOG" | head -200 || true
              echo ""
              echo "--- Failure Context ---"
              awk '/What went wrong|FAILURE: Build failed|Execution failed for task/{f=1;c=0} f&&c<120{print;c++} /BUILD FAILED/{if(f)exit}' "$LOG" || true
            } > "$REPORT_DIR/03-test-errors.txt"
            echo "::error::Unit tests failed (exit $EXIT)"
            exit $EXIT
          fi

      - name: Package & upload test error report
        if: failure()
        shell: bash
        run: |
          REPORT_DIR="${{ github.workspace }}/error-report"
          mkdir -p "$REPORT_DIR"
          cd "$REPORT_DIR"
          zip -r "${{ github.workspace }}/test-error-report.zip" . >/dev/null

      - name: Upload test error report ZIP
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-error-report
          path: ${{ github.workspace }}/test-error-report.zip
          if-no-files-found: warn
          retention-days: 30

  lint:
    name: Code Quality Checks
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Restore Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ needs.setup.outputs.sdk-cache-key }}
          fail-on-cache-miss: true

      - name: Export SDK environment
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${{ env.ANDROID_SDK_ROOT }}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Grant execute permission
        shell: bash
        run: chmod +x ./gradlew

      - name: Run lint
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/gradle-lint.log
          REPORT_DIR="${{ github.workspace }}/error-report"
          mkdir -p "$REPORT_DIR"

          set +e
          ./gradlew lintDebug --no-daemon --stacktrace --continue --console=plain > "$LOG" 2>&1
          EXIT=$?
          set -e

          if [ $EXIT -ne 0 ]; then
            {
              echo "=== STEP: Run lint ==="
              echo "Command: ./gradlew lintDebug"
              echo "Exit Code: $EXIT"
              echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
              echo "--- Lint Errors ---"
              grep -nE 'error:|Error:|FAILURE:|FAILED|Caused by:|Exception|BUILD FAILED|What went wrong|> Task .* FAILED|Lint found' "$LOG" | head -300 || true
              echo ""
              echo "--- Failure Context ---"
              awk '/What went wrong|FAILURE: Build failed|Execution failed for task/{f=1;c=0} f&&c<120{print;c++} /BUILD FAILED/{if(f)exit}' "$LOG" || true
            } > "$REPORT_DIR/04-lint-errors.txt"
            echo "::error::Lint failed (exit $EXIT)"
            exit $EXIT
          fi

      - name: Run ktlint if configured
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/gradle-ktlint.log
          REPORT_DIR="${{ github.workspace }}/error-report"
          mkdir -p "$REPORT_DIR"

          if [ -f "ktlint.gradle.kts" ] || grep -q "ktlint" app/build.gradle.kts 2>/dev/null; then
            set +e
            ./gradlew ktlintCheck --no-daemon --stacktrace --console=plain > "$LOG" 2>&1
            EXIT=$?
            set -e
            if [ $EXIT -ne 0 ]; then
              {
                echo "=== STEP: ktlint ==="
                echo "Exit Code: $EXIT"
                echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo ""
                grep -nE 'error:|Error:|FAILURE:|FAILED|Caused by:|Exception|BUILD FAILED|ktlint' "$LOG" | head -200 || true
              } > "$REPORT_DIR/05-ktlint-errors.txt"
              echo "::warning::ktlint reported issues"
            fi
          else
            echo "ktlint not configured, skipping"
          fi

      - name: Package & upload lint error report
        if: failure()
        shell: bash
        run: |
          REPORT_DIR="${{ github.workspace }}/error-report"
          mkdir -p "$REPORT_DIR"
          cd "$REPORT_DIR"
          zip -r "${{ github.workspace }}/lint-error-report.zip" . >/dev/null

      - name: Upload lint error report ZIP
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-error-report
          path: ${{ github.workspace }}/lint-error-report.zip
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Create Release
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      always() &&
      needs.build.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_type == 'release'
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: sqli-hunter-release-apk
          path: release-artifacts

      - name: Verify APK present
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find release-artifacts -type f -name '*.apk' | head -1 || true)"
          [ -n "$APK" ] && [ -f "$APK" ] || { echo "::error::No APK downloaded"; exit 1; }
          echo "Release APK: $APK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SQLi Hunter v${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          body: |
            ## SQLi Hunter Release v${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

  notify:
    name: Send Notifications
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

    steps:
      - name: Send Slack notification
        if: ${{ env.SLACK_WEBHOOK != '' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ env.SLACK_WEBHOOK }}
          SLACK_COLOR: >-
            ${{ job.status == 'success' && '#2EB67D' || job.status == 'failure' && '#E01E5A' || '#FFCC00' }}
          SLACK_TITLE: "SQLi Hunter Build ${{ job.status }}"
          SLACK_MESSAGE: >-
            Build ${{ job.status }} for ${{ github.ref }}@${{ github.sha }}
          SLACK_CHANNEL: android-ci
          SLACK_USERNAME: GitHub Actions
          SLACK_ICON: https://github.com/github.png

      - name: Warn if Slack webhook missing
        if: ${{ env.SLACK_WEBHOOK == '' }}
        shell: bash
        run: echo "::warning::SLACK_WEBHOOK secret not set — skipping notification"
