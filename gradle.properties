# Gradle properties for SQLi Hunter Application

# Android Gradle Plugin
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=440m -Dfile.encoding=UTF-8

# Kotlin
kotlin.code.style=official
kotlin.code.style.severity=error

# Daemon
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Caching
org.gradle.caching=true

# Memory
org.gradle.workers.max=4

# Build
android.enableJetifier=true
android.useAndroidX=true

# KSP (Kotlin Symbol Processing)
ksp.args=-Xjsr305=true

# Room
room.incremental=true
room.expandProjection=true

# Hilt
hilt.enableAggregatingTask=false

# Enable new Gradle features
gradle.properties.enableFeaturePreview=true

# Use new API for Gradle
android.overridePathCheck=true

# Disable animations
org.gradle.console=plain

# Build scan
com.gradle.enterprise=true

# Java compatibility
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
